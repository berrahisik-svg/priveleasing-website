<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PRIVÉ · Leasing, Finanzierung und Beschaffung ausgewählter Luxusgüter</title>
    <meta name="description" content="Leasing, Finanzierung und Beschaffung ausgewählter Luxusgüter. Persönlich begleitet." />
    <meta name="theme-color" content="#16181b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PRIVÉ · Leasing, Finanzierung und Beschaffung ausgewählter Luxusgüter" />
    <meta property="og:description" content="Leasing, Finanzierung und Beschaffung ausgewählter Luxusgüter. Persönlich begleitet." />
    <meta property="og:image" content="/img/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/mona-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Intro nur beim ersten Besuch pro Sitzung und nur mit Bewegung. */
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var seen = sessionStorage.getItem('prive:intro');
          var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!seen && !still) {
            d.classList.add('is-intro');
            /* Falls JavaScript hängt, bleibt die Seite nicht verdeckt. */
            setTimeout(function () {
              if (!d.classList.contains('intro-mounted')) d.classList.remove('is-intro');
            }, 4000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
